name: SafeWalk CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install paho-mqtt boto3 pyyaml flask python-dotenv

      - name: Run sensor test
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, 'sensors')
          print('Sensor module imports OK')
          "

      - name: Run fog node test
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, 'fog_node')
          print('Fog node module imports OK')
          "

  deploy-lambda:
    name: Deploy Lambda to AWS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy Lambda function
        run: |
          cd cloud
          zip lambda_function.zip lambda_handler.py
          aws lambda update-function-code \
            --function-name safewalk-alert-handler \
            --zip-file fileb://lambda_function.zip \
            --region us-east-1
          echo " Lambda deployed!"

  deploy-dashboard:
    name: Build and Deploy Dashboard to ECS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region us-east-1 | docker login \
            --username AWS \
            --password-stdin \
            653266299688.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and Push Docker Image
        env:
          IMAGE_NAME: 653266299688.dkr.ecr.us-east-1.amazonaws.com/safewalk-dashboard
        run: |
          docker build -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:latest"
          echo " Docker image pushed to ECR..."

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster safewalk-cluster \
            --service safewalk-dashboard \
            --force-new-deployment \
            --region us-east-1
          echo "Deployed to http://safewalk-lb-12772833.us-east-1.elb.amazonaws.com"