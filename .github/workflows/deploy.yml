name: SafeWalk CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install paho-mqtt boto3 pyyaml flask python-dotenv 

      - name: Run sensor test
        run: |
          python3 -c "
          import json
          import sys
          sys.path.insert(0, 'sensors')
          print(' Sensor module imports OK')
          "

      - name: Run fog node test
        run: |
          python3 -c "
          import json
          import sys
          sys.path.insert(0, 'fog_node')
          print(' Fog node module imports OK')
          "

  deploy-lambda:
    name: Deploy Lambda to AWS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy Lambda function
        run: |
          cd cloud
          zip lambda_function.zip lambda_handler.py
          aws lambda update-function-code \
            --function-name safewalk-alert-handler \
            --zip-file fileb://lambda_function.zip \
            --region us-east-1
          echo " Lambda deployed successfully!"

  deploy-dashboard:
    name: Deploy Dashboard to EC2
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
              cd safewalk-fog-edge
              git pull origin main
              pip3 install flask boto3 python-dotenv
              pkill -f "python3 app.py" || true
              export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
              export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
              export AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
              export AWS_DEFAULT_REGION=us-east-1
              nohup python3 dashboard/app.py > dashboard.log 2>&1 &
              echo "Dashboard deployed!"
