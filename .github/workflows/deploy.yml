name: SafeWalk CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install paho-mqtt boto3 pyyaml flask python-dotenv

      - name: Run sensor test
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, 'sensors')
          print('Sensor module imports OK')
          "

      - name: Run fog node test
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, 'fog_node')
          print('Fog node module imports OK')
          "

  deploy-dashboard:
    name: Build and Deploy Dashboard
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/safewalk-dashboard
        run: |
          docker build -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:latest"
          echo " Docker image pushed to GitHub Container Registry!"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Update ECS Task Definition
        run: |
          aws ecs register-task-definition \
            --family safewalk-dashboard \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu 256 \
            --memory 512 \
            --execution-role-arn arn:aws:iam::653266299688:role/LabRole \
            --task-role-arn arn:aws:iam::653266299688:role/LabRole \
            --container-definitions '[{"name":"safewalk-dashboard","image":"ghcr.io/${{ github.repository_owner }}/safewalk-dashboard:latest","portMappings":[{"containerPort":5000,"protocol":"tcp"}],"environment":[{"name":"AWS_DEFAULT_REGION","value":"us-east-1"},{"name":"TABLE_NAME","value":"safewalk_incidents"}],"logConfiguration":{"logDriver":"awslogs","options":{"awslogs-group":"/ecs/safewalk-dashboard","awslogs-region":"us-east-1","awslogs-stream-prefix":"ecs"}}}]' \
            --region us-east-1
          echo " Task definition updated!"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster safewalk-cluster \
            --service safewalk-dashboard \
            --task-definition safewalk-dashboard \
            --force-new-deployment \
            --region us-east-1
          echo " ECS deployment triggered!"
          echo " http://safewalk-lb-12772833.us-east-1.elb.amazonaws.com"